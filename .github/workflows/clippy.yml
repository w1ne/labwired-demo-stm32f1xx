on:
  push:
    branches: [master]
  pull_request:

name: Clippy check

permissions:
  contents: read

jobs:
  clippy_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.95, Clippy and Cortex-M3 target
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy --target thumbv7m-none-eabi

      - name: Run Clippy
        run: cargo +1.95.0 clippy --features=stm32f103 --target thumbv7m-none-eabi -- -D warnings
